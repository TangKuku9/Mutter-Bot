<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutter 管理面板 - 登录</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #273449;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1e2a52 0%, transparent 60%),
                  radial-gradient(900px 500px at 100% 110%, #2a1e52 0%, transparent 55%),
                  var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }
    h1 {
      font-size: 20px;
      text-align: center;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 26px;
    }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 11px 13px;
      background: #0f1729;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    input::placeholder { color: #64748b; }
    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      background: var(--accent);
      border: none;
      border-radius: 9px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .alert.show { display: block; }
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 22px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Q</div>
    <h1>Mutter 管理面板</h1>
    <div class="subtitle">请登录以继续</div>

    <div id="alert" class="alert" role="alert"></div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="username">账号</label>
        <input id="username" name="username" type="text" placeholder="请输入账号" autocomplete="username" required autofocus />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn" id="submitBtn">登 录</button>
    </form>

    <div class="footer">Mutter 管理面板</div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var returnUrl = params.get("return") || "/";

      // 仅允许相对路径，防止开放重定向
      if (!returnUrl.startsWith("/") || returnUrl.startsWith("//")) {
        returnUrl = "/";
      }

      var form = document.getElementById("loginForm");
      var alertBox = document.getElementById("alert");
      var submitBtn = document.getElementById("submitBtn");

      function showAlert(msg) {
        alertBox.textContent = msg;
        alertBox.classList.add("show");
      }

      function clearAlert() {
        alertBox.classList.remove("show");
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        clearAlert();

        var username = document.getElementById("username").value.trim();
        var password = document.getElementById("password").value;

        if (!username || !password) {
          showAlert("请输入账号和密码");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "登录中...";

        fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ username: username, password: password })
        })
          .then(function (resp) {
            if (resp.ok) return resp.json();
            return resp.json().then(function (data) {
              throw new Error(data.error || "登录失败");
            });
          })
          .then(function () {
            window.location.href = returnUrl;
          })
          .catch(function (err) {
            showAlert(err.message || "登录失败，请重试");
            submitBtn.disabled = false;
            submitBtn.textContent = "登 录";
          });
      });
    })();
  </script>
</body>
</html>
