version: 2
updates:
  # 后端依赖：csproj 用浮动版本号（如 Microsoft.Extensions.* 为 10.0.*、EF Core 仍 9.0.*），安全更新尤其需要自动跟进
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "preview-fixes"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # 面板前端依赖
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "preview-fixes"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # major 一律不开 PR：面板的大版本升级必须人工验证（vite 8 / plugin-vue 6 需配套升、
    # vue-router 5 有破坏性变更）。此前 Dependabot 基于旧基线的 major PR 还带出过
    # element-plus / vue 的版本回退，因此不再自动跟进，改为需要时手工升。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 本仓库的 CI 工作流自身
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    target-branch: "preview-fixes"
    commit-message:
      prefix: "build"
