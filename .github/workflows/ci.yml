name: CI

on:
  push:
    branches: [main, preview-features, preview-fixes]
  pull_request:
    branches: [main, preview-features, preview-fixes]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: 构建与自检 (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Mutter.sln

      # 「0 warning / 0 error」由仓库根的 Directory.Build.props 强制（TreatWarningsAsErrors），
      # 本地与 CI 行为一致，因此这里不需要再传命令行参数。
      - name: Build
        run: dotnet build Mutter.sln -c Release --no-restore

      # 逻辑与运行时回归只使用合成临时库及假 HTTP；第 4~6 段仍需指定测试库。
      - name: 自检（逻辑与合成运行时）
        run: dotnet run --project tools/ProactiveCheck -c Release --no-build -- --logic-only

  web:
    name: 面板前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # 版本号唯一来源是 Directory.Build.props；package.json 必须同步，否则发版口径会漂移。
      - name: 版本一致性
        run: |
          dotnet_version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          web_version=$(node -p "require('./web/package.json').version")
          echo ".NET=$dotnet_version web=$web_version"
          test "$dotnet_version" = "$web_version"

      # 构建产物 wwwroot 不入库，这里只验证 web/ 源码能构建通过。
      - name: 面板交互逻辑自检
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
