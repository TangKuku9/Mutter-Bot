name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提 PR 前请先读 [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)：
        新功能的目标分支是 `preview-features`。
        注意项目红线——例如**不得**实现绕过平台频控、自动加群、批量私聊、爬取成员列表等能力。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述你遇到的场景，而不是直接跳到实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 你希望它怎么工作？面板上是否需要一个开关？
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: compliance
    attributes:
      label: 合规确认
      options:
        - label: 这个需求不需要绕过 QQ 官方频控或平台规则
          required: true
        - label: 这个需求不涉及收集群成员隐私数据
          required: true
